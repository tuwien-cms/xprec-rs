[package]
name = "xprec"
version = "0.2.1"
authors = [
    "Markus Wallerberger <markus.wallerberger@tuwien.ac.at>"
    ]
description = "Fast emulated quadruple (double-double) precision arithmetic"
keywords = [
    "math",
    "precision",
    "numerics"
    ]
categories = [
    "algorithms",
    "mathematics",
    "science"
    ]
readme = "README.md"
license = "MIT"
repository = "https://github.com/tuwien-cms/xprec-rs"
edition = "2024"
exclude = [
    "notebooks/",
    ".github/",
    ]

[dependencies]
libm = "0.2"
num-traits = "0.2"
simba = "0.9"  # unsure
approx = "0.5"

[dev-dependencies]
rug = "1.28"
