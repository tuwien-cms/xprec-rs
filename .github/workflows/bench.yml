name: Benchmark comparison

# Compares xprec::Df64 against MultiFloats.jl (Float64x2) and the numpy xprec
# extension (ddouble) for the batch of operations in bench/README.md.
#
# An operation that is more than 100x slower than a baseline fails the check
# and is printed as an ::error:: annotation.  A harness/environment failure
# (missing Julia packages, failed pip build) only produces a ::warning:: and
# leaves the check green, so that broken infrastructure does not block a pull
# request.  The full comparison table is written to the job log and to the
# step summary.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'bench/**'
      - '.github/workflows/bench.yml'
  # Only used to keep the dependency caches warm; see the `warm-cache` job.
  push:
    branches: [mainline]
    paths:
      - 'bench/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `actions/cache` is scoped to the ref that created the entry, and a
  # `pull_request` run caches under `refs/pull/N/merge`, which no other pull
  # request can read.  Only a trusted default-branch trigger (`push`) writes
  # into the default-branch scope that pull-request runs can restore, so warm
  # the caches here.  On a cache hit this job only restores and exits.
  warm-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Julia depot
        id: julia-cache
        uses: actions/cache@v5
        with:
          path: ~/.julia
          key: julia-${{ runner.os }}-${{ hashFiles('bench/julia/Project.toml') }}

      - name: Cache pip
        id: pip-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('bench/python/requirements.txt') }}

      - name: Decide whether the caches need warming
        id: decide
        run: |
          if [ '${{ steps.julia-cache.outputs.cache-hit }}' = 'true' ] && \
             [ '${{ steps.pip-cache.outputs.cache-hit }}' = 'true' ]; then
              echo "warm=false" >> "$GITHUB_OUTPUT"
          else
              echo "warm=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.warm == 'true'
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - if: steps.decide.outputs.warm == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Warm the caches
        if: steps.decide.outputs.warm == 'true'
        run: |
          julia --project=bench/julia -e 'using Pkg; Pkg.instantiate()'
          python -m pip install -r bench/python/requirements.txt

  compare:
    # The comparison gates pull requests; the push trigger exists only to warm
    # the caches in the default-branch scope.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      # One thread everywhere, so that the comparison is not a measurement of
      # how well each runtime parallelises.
      JULIA_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      XPREC_BENCH: bench/rust/target/release/xprec-bench
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Julia depot
        uses: actions/cache@v5
        with:
          path: ~/.julia
          key: julia-${{ runner.os }}-${{ hashFiles('bench/julia/Project.toml') }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('bench/python/requirements.txt') }}

      - name: Install Python benchmark dependencies
        id: python_deps
        continue-on-error: true
        run: python -m pip install -r bench/python/requirements.txt

      - name: Install Julia benchmark dependencies
        id: julia_deps
        continue-on-error: true
        run: julia --project=bench/julia -e 'using Pkg; Pkg.instantiate()'

      # Each harness step reads the core clock with `xprec-bench --clock` on
      # the same core before and after the harness, so that `compare.py` can
      # convert that harness's column to cycles per element and warn when the
      # clock moved in between.
      - name: Run Rust benchmark
        run: |
          CORE=$(( $(nproc) - 1 ))
          RUSTFLAGS="-C target-feature=+fma,+avx2" \
              cargo build --release --manifest-path bench/rust/Cargo.toml
          BEFORE=$(taskset -c "$CORE" "$XPREC_BENCH" --clock)
          taskset -c "$CORE" "$XPREC_BENCH" --out bench/out/rust.csv
          echo "CLOCK_RUST=$BEFORE,$(taskset -c "$CORE" "$XPREC_BENCH" --clock)" >> "$GITHUB_ENV"

      - name: Run Julia benchmark
        if: steps.julia_deps.outcome == 'success'
        continue-on-error: true
        run: |
          CORE=$(( $(nproc) - 1 ))
          BEFORE=$(taskset -c "$CORE" "$XPREC_BENCH" --clock)
          taskset -c "$CORE" julia --project=bench/julia bench/julia/bench.jl \
              --out bench/out/julia.csv
          echo "CLOCK_JULIA=$BEFORE,$(taskset -c "$CORE" "$XPREC_BENCH" --clock)" >> "$GITHUB_ENV"

      - name: Run Python benchmark
        if: steps.python_deps.outcome == 'success'
        continue-on-error: true
        run: |
          CORE=$(( $(nproc) - 1 ))
          BEFORE=$(taskset -c "$CORE" "$XPREC_BENCH" --clock)
          taskset -c "$CORE" python bench/python/bench.py --out bench/out/python.csv
          echo "CLOCK_PYTHON=$BEFORE,$(taskset -c "$CORE" "$XPREC_BENCH" --clock)" >> "$GITHUB_ENV"

      - name: Compare
        run: |
          MODEL=$(LANG=C lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          JULIA_V=$(julia --version 2>/dev/null || echo unavailable)
          MF_V=$(julia --project=bench/julia -e \
              'using Pkg, MultiFloats; println(pkgversion(MultiFloats))' \
              2>/dev/null || echo unavailable)
          PY_V=$(python -c \
              'import numpy, xprec; print("numpy", numpy.__version__, "xprec", xprec.__version__)' \
              2>/dev/null || echo unavailable)
          python bench/compare.py \
              --rust bench/out/rust.csv \
              --julia bench/out/julia.csv \
              --python bench/out/python.csv \
              --threshold 100 \
              --json bench/out/report.json \
              --markdown bench/out/report.md \
              --clock "rust=${CLOCK_RUST:-}" \
              --clock "julia=${CLOCK_JULIA:-}" \
              --clock "python=${CLOCK_PYTHON:-}" \
              --github \
              --env "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --env "git=${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
              --env "runner=${MODEL}, $(nproc) vCPU, taskset -c $(( $(nproc) - 1 ))" \
              --env "rustc=$(rustc --version) RUSTFLAGS=-C target-feature=+fma,+avx2" \
              --env "julia=${JULIA_V} MultiFloats=${MF_V} JULIA_NUM_THREADS=1" \
              --env "python=${PY_V} OMP_NUM_THREADS=1"

      - name: Publish step summary
        if: always()
        run: |
          if [ -f bench/out/report.md ]; then
              cat bench/out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
              echo "no benchmark report was produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-report
          path: bench/out/
          if-no-files-found: warn
